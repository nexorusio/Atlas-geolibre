name: Atlas Catalog frontend

on:
  pull_request:
    branches: [main]
    paths: ['deploy/geolens-branding/**', '.github/workflows/publish-catalog.yml', 'apps/geolibre-desktop/public/**']
  push:
    branches: [main]
    paths: ['deploy/geolens-branding/**', '.github/workflows/publish-catalog.yml', 'apps/geolibre-desktop/public/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/geolens-branding/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/nexorusio/atlas-geolibre:catalog-main
            ghcr.io/nexorusio/atlas-geolibre:catalog-sha-${{ github.sha }}
          cache-from: type=gha,scope=atlas-catalog
          cache-to: type=gha,mode=max,scope=atlas-catalog
