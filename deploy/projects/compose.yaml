name: geolibre-projects

services:
  projects-db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: geolibre_projects
      POSTGRES_USER: geolibre_projects
      POSTGRES_PASSWORD: ${PROJECTS_DB_PASSWORD:?Run configure.py first}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    volumes:
      - projects_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U geolibre_projects -d geolibre_projects']
      interval: 5s
      timeout: 5s
      retries: 20

  projects-api:
    image: ${PROJECTS_IMAGE:?Set a published projects-sha image}
    command: [uvicorn, 'geolibre_server_api.main:create_app', --factory, --host, '0.0.0.0', --port, '8000', --no-access-log]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GEOLIBRE_DATABASE_URL: postgresql+psycopg://geolibre_projects:${PROJECTS_DB_PASSWORD:?Run configure.py first}@projects-db:5432/geolibre_projects
      GEOLIBRE_STORAGE_PATH: /data/objects
      GEOLIBRE_PUBLIC_URL: ${ATLAS_ORIGIN:?Set the HTTPS Atlas origin}/projects
      GEOLIBRE_VIEWER_URL: ${ATLAS_ORIGIN}
      GEOLIBRE_CORS_ORIGINS: ${ATLAS_ORIGIN}
      GEOLIBRE_OAUTH_CLIENTS: ${PROJECTS_OAUTH_CLIENTS:?Run configure.py first}
    volumes:
      - projects_objects:/data/objects
    # Operator account provisioning only. The authenticated gateway serves users.
    ports:
      - '127.0.0.1:18001:8000'
    depends_on:
      projects-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  projects-gateway:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default: {}
      atlas_proxy:
        aliases: [geolibre-projects-gateway]
    depends_on:
      projects-api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/projects/health']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  projects_pgdata: {}
  projects_objects: {}

networks:
  atlas_proxy:
    external: true
    name: ${ATLAS_PROXY_NETWORK:?Set the existing Caddy Docker network}
