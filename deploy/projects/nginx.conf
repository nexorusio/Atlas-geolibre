worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    # A deployment-wide bucket bounds password hashing even behind a tunnel,
    # where every client may otherwise appear to have the same source address.
    limit_req_zone $server_name zone=login:1m rate=30r/m;
    limit_req_zone $server_name zone=tokens:1m rate=120r/m;
    limit_req_status 429;
    client_max_body_size 80m;
    server_tokens off;
    # OAuth codes, signed links and credentials must not enter access logs.
    access_log off;
    error_log /dev/stderr crit;

    server {
        listen 8080;
        # An unnamed server has an empty $server_name; nginx excludes empty
        # keys from limit_req accounting. Keep this bucket fixed and non-empty.
        server_name projects-gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;

        location = /projects { return 308 /projects/; }

        # Operators create accounts through the loopback-only API port.
        # Cloudflare email admission never creates an application account.
        location = /projects/api/accounts { return 403; }
        location = /projects/api/accounts/ { return 403; }

        location = /projects/oauth/authorize {
            limit_req zone=login burst=10 nodelay;
            client_max_body_size 16k;
            proxy_pass http://projects-api:8000/oauth/authorize;
        }
        location = /projects/oauth/token {
            limit_req zone=tokens burst=20 nodelay;
            client_max_body_size 16k;
            proxy_pass http://projects-api:8000/oauth/token;
        }
        location = /projects/api/auth/token {
            limit_req zone=login burst=10 nodelay;
            client_max_body_size 16k;
            proxy_pass http://projects-api:8000/api/auth/token;
        }

        # RFC 8414 inserts well-known before the issuer path.
        location = /.well-known/oauth-authorization-server/projects {
            proxy_pass http://projects-api:8000;
        }

        location /projects/ {
            proxy_pass http://projects-api:8000/;
        }
        location / { return 404; }
    }
}
